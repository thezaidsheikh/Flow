services:
  - type: web
    name: flow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "3600000"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend-domain.com"
