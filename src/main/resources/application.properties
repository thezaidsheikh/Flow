spring.application.name=flow

# Server configuration
server.port=${APP_PORT:3002}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
server.servlet.context-path=/api/v1

# Graceful shutdown so in-flight requests finish before the pod/process stops
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Profile
spring.profiles.default=dev

# Load .env from project root at startup (Spring Boot 2.4+ native — no extra lib needed)
spring.config.import=optional:file:.env[.properties]

# ─── Database (Supabase PostgreSQL) ─────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Spring Modulith ──────────────────────────────────────────────────────────
spring.modulith.events.completion-mode=update
spring.modulith.events.republish-outstanding-events-on-restart=false

# ─── Actuator (lock down secrets exposure) ──────────────────────────────────
management.endpoint.env.show-values=NEVER
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ─── JWT Configuration ────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ─── CORS ─────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
