spring.application.name=flow

# Server configuration
server.port=${APP_PORT:3002}

# Management endpoint configuration
management.endpoint.health.show-details=always

server.servlet.context-path=/api/v1

# Database configuration - uses environment variables with defaults for local development
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?user=${DB_USER:postgres}&password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Spring Modulith configuration
spring.modulith.enabled=false

# Security: Do not log sensitive configuration values
logging.level.org.hibernate.SQL=${JPA_SHOW_SQL:false}