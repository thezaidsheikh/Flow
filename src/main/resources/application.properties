spring.application.name=flow
# Server configuration
server.port=${APP_PORT:3002}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
server.servlet.context-path=/api/v1
# Graceful shutdown so in-flight requests finish before the pod/process stops
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Profile
spring.profiles.default=dev
# Load .env from project root at startup (Spring Boot 2.4+ native — no extra lib needed)
spring.config.import=optional:file:.env[.properties]
# ─── Database (Supabase PostgreSQL) ───────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ─── Spring Modulith ──────────────────────────────────────────────────────────
spring.modulith.events.completion-mode=update
spring.modulith.events.republish-outstanding-events-on-restart=false
# ─── Hibernate Logging ────────────────────────────────────────────────────────
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
# ─── Actuator (lock down secrets exposure) ────────────────────────────────────
management.endpoint.env.show-values=NEVER
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# ─── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=true
springdoc.packages-to-scan=com.project.flow
# supabase.url=${SUPABASE_URL}
# supabase.anon-key=${SUPABASE_ANON_KEY}
# supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
# ─── JWT Configuration ────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
# ─── CORS ─────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# ─── Webhook Base URL ─────────────────────────────────────────────────────
app.webhook.base-url=${WEBHOOK_BASE_URL:https://fanatic-doorbell-theorize.ngrok-free.dev/api/v1}
